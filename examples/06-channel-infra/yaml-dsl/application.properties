# Camel CLI — component configuration
kafka.brokers=localhost:9092
camel.component.pulsar.service-url=pulsar://localhost:6650

# PostgreSQL datasource (for channel-adapter SQL route)
spring.datasource.url=jdbc:postgresql://localhost:5432/eipdb
spring.datasource.username=eipuser
spring.datasource.password=eippass
spring.datasource.driverClassName=org.postgresql.Driver

# REST. The embedded HTTP server port is a CLI flag, not a property:
#   camel run * --port=8082
# Without it the server takes 8080, which the stack's Pulsar already holds.
