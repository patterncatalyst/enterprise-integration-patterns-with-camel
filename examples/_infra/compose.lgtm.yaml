services:
  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: docker.io/grafana/grafana:13.2.3
    container_name: eip-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:Z
      - grafana-data:/var/lib/grafana:Z
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    # Start ordering only. The Loki, Tempo and Mimir images are distroless —
    # no shell, no wget, no curl — so they cannot run a container healthcheck
    # and `condition: service_healthy` would block here forever. Readiness is
    # polled from the host instead; see wait_ready() in scripts/setup-stack.sh.
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - eip-net

  # ── Loki (logs) ─────────────────────────────────────────────────────────
  loki:
    image: docker.io/grafana/loki:3.7.8
    container_name: eip-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:Z
      - loki-data:/loki:Z
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 512m
    networks:
      - eip-net

  # ── Tempo (traces) ──────────────────────────────────────────────────────
  tempo:
    image: docker.io/grafana/tempo:3.1.0
    container_name: eip-tempo
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/config.yaml:Z
      - tempo-data:/var/tempo:Z
    command: -config.file=/etc/tempo/config.yaml
    mem_limit: 512m
    networks:
      - eip-net

  # ── Mimir (metrics) ────────────────────────────────────────────────────
  mimir:
    image: docker.io/grafana/mimir:3.2.2
    container_name: eip-mimir
    ports:
      - "9009:9009"
    volumes:
      - ./mimir/mimir-config.yaml:/etc/mimir/config.yaml:Z
      - mimir-data:/data:Z
    command: -config.file=/etc/mimir/config.yaml
    mem_limit: 512m
    networks:
      - eip-net

  # ── OpenTelemetry Collector ─────────────────────────────────────────────
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.162.0
    container_name: eip-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"   # health_check extension, polled from the host
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:Z
    command: --config=/etc/otelcol-contrib/config.yaml
    mem_limit: 512m
    # Start ordering only — see the note on grafana above.
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - eip-net

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:

networks:
  eip-net:
    name: eip-net
