services:
  # ── Kafka (KRaft, single broker) ──────────────────────────────────────────
  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: eip-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Share groups (KIP-932, Appendix P) need the share protocol enabled on
      # the coordinator. share.version is finalized by default in Kafka 4.x, but
      # without "share" listed here every share consumer times out with no
      # explanation -- the feature looks enabled and simply does not deliver.
      - KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,streams,share
      # The share coordinator keeps its state in an internal topic that defaults
      # to replication factor 3 and min ISR 2 -- neither satisfiable on a single
      # broker, so the coordinator never becomes usable and share consumers just
      # time out. Same workaround as the offsets and transaction state topics.
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1
      - CLUSTER_ID=RUlQQ2FtZWxQYXR0ZXJucw
    volumes:
      - kafka-data:/var/lib/kafka/data:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - eip-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: eip-kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=eip-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - eip-net

  # ── Pulsar (standalone) ──────────────────────────────────────────────────
  pulsar:
    image: docker.io/apachepulsar/pulsar:5.0.0
    container_name: eip-pulsar
    command: bin/pulsar standalone --advertised-address localhost
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      - PULSAR_MEM=-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m
      - PULSAR_PREFIX_advertisedAddress=localhost
      - PULSAR_STANDALONE_USE_ZOOKEEPER=0
    volumes:
      - pulsar-data:/pulsar/data:Z
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - eip-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: docker.io/library/redis:8.10.2-alpine
    container_name: eip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data:Z
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - eip-net

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    container_name: eip-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=eipdb
      - POSTGRES_USER=eipuser
      - POSTGRES_PASSWORD=eippass
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql:Z
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:Z
    mem_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "shared_buffers=128MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eipuser -d eipdb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - eip-net

  # ── Apicurio Schema Registry ────────────────────────────────────────────
  apicurio:
    image: docker.io/apicurio/apicurio-registry:3.3.3
    container_name: eip-apicurio
    ports:
      - "8081:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - eip-net

  # ── flagd (OpenFeature flag evaluation) ─────────────────────────────────
  flagd:
    image: ghcr.io/open-feature/flagd:v0.17.0
    container_name: eip-flagd
    ports:
      - "8013:8013"   # gRPC evaluation
      - "8014:8014"   # metrics / health
    volumes:
      - ./flagd/flags.json:/etc/flagd/flags.json:Z
    command: start --uri file:/etc/flagd/flags.json
    mem_limit: 256m
    networks:
      - eip-net

volumes:
  kafka-data:
    name: eip-kafka-data
  pulsar-data:
    name: eip-pulsar-data
  redis-data:
    name: eip-redis-data
  postgres-data:
    name: eip-postgres-data

networks:
  eip-net:
    name: eip-net
