spring.application.name=eip-kafka-producer-tuning

kafka.brokers=localhost:9092

server.port=8089

logging.level.org.apache.camel=INFO
logging.level.com.example.eip=DEBUG

# No web starter here, so Camel's run controller is what keeps the JVM alive.
# Note the prefix: camel.main, not camel.springboot.
camel.main.run-controller=true
