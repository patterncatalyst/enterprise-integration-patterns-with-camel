quarkus.application.name=eip-quarkus-dev
quarkus.http.port=8097

# This is the one example in the tutorial that leaves Dev Services ON. Run
# `mvn quarkus:dev` with no infrastructure at all and Quarkus starts a Kafka
# broker for you, on a random port, and sets kafka.bootstrap.servers to point
# at it.
#
# Note what is NOT here: there is no unconditional kafka.bootstrap.servers.
# Dev Services deliberately back off the moment you configure the connection
# yourself -- the reasoning being that if you named a broker, you meant it. Set
# that property outside a profile and Dev Services silently does nothing, which
# looks exactly like Dev Services being broken.
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=false

# Outside dev mode, use the compose stack.
%prod.kafka.bootstrap.servers=localhost:9092
%prod.quarkus.kafka.devservices.enabled=false
%test.kafka.bootstrap.servers=localhost:9092

# Tests drive the routes directly; the generator would fight them for offsets.
%test.eip.demo.generator.enabled=false

quarkus.log.category."com.example.eip".level=INFO
