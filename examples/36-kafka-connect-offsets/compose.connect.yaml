# Kafka Connect for Appendix R. Kept out of the base stack on purpose: it is
# only needed for this one appendix, and it is another JVM to keep warm.
#
#   docker compose -p eip -f ../_infra/compose.yaml -f compose.connect.yaml up -d connect
services:
  connect:
    image: docker.io/apache/kafka:4.3.1
    container_name: eip-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        # Kafka 4.x no longer puts the FileStream connectors on the worker
        # classpath. They ship in libs/ but are only discovered through
        # plugin.path, so give them a directory of their own -- pointing
        # plugin.path at all of libs/ makes the worker scan ~200 jars and delays
        # the REST port by minutes.
        mkdir -p /tmp/connect/plugins
        cp /opt/kafka/libs/connect-file-*.jar /tmp/connect/plugins/
        # connect-distributed needs its worker config written at runtime: the
        # image ships a template pointing at localhost:9092, which is the
        # container's own loopback, not the broker.
        cat > /tmp/connect/worker.properties <<'EOF'
        bootstrap.servers=kafka:9094
        group.id=eip-connect-cluster
        key.converter=org.apache.kafka.connect.json.JsonConverter
        value.converter=org.apache.kafka.connect.json.JsonConverter
        key.converter.schemas.enable=false
        value.converter.schemas.enable=false
        offset.storage.topic=eip.connect.offsets
        offset.storage.replication.factor=1
        offset.storage.partitions=1
        config.storage.topic=eip.connect.configs
        config.storage.replication.factor=1
        status.storage.topic=eip.connect.status
        status.storage.replication.factor=1
        status.storage.partitions=1
        offset.flush.interval.ms=5000
        listeners=HTTP://0.0.0.0:8083
        plugin.path=/tmp/connect/plugins
        EOF
        exec /opt/kafka/bin/connect-distributed.sh /tmp/connect/worker.properties
    mem_limit: 1g
    networks:
      - eip-net

networks:
  eip-net:
    name: eip-net
    external: true
