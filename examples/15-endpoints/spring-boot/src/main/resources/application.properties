spring.application.name=eip-endpoints

# Kafka broker
kafka.brokers=localhost:9092
camel.component.pulsar.service-url=pulsar://localhost:6650

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/eipdb
spring.datasource.username=eipuser
spring.datasource.password=eippass

# Logging
logging.level.org.apache.camel=INFO
logging.level.com.example.eip=DEBUG

# Server port — avoid conflict with Pulsar admin on 8080
server.port=8082

# No web starter here, so Camel's run controller is what keeps the JVM alive.
# Note the prefix: camel.main, not camel.springboot.
camel.main.run-controller=true
