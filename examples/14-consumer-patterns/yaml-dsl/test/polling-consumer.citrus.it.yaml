name: polling-consumer-test
description: Test verifying the Polling Consumer pattern — timer-triggered pollEnrich from Kafka
variables:
  - name: kafka.broker
    value: localhost:9092
  - name: order.id
    value: "citrus:randomNumber(4)"
  - name: order.eventType
    value: "order_placed"
  - name: order.amount
    value: 99
actions:
  - testcontainers:
      compose:
        up:
          file: "_infra/compose.yaml"
  - waitFor:
      timeout: "25000"
      http:
        url: http://localhost:8090
  - camel:
      jbang:
        run:
          integration:
            name: "polling-consumer"
            file: "../polling-consumer.camel.yaml"
            systemProperties:
              file: "../application.properties"

  - camel:
      jbang:
        verify:
          integration: "polling-consumer"
          logMessage: "Routes startup"

  - send:
      endpoint: >-
        kafka:eip.consumer.poll?server=${kafka.broker}
      message:
        body:
          resource:
            file: "templates/order.json"

  - camel:
      jbang:
        verify:
          integration: "polling-consumer"
          logMessage: "Polled message: order ${order.id}"
