name: competing-consumers-test
description: Test verifying the Competing Consumers pattern — parallel Kafka consumption via consumer group
variables:
  - name: kafka.broker
    value: localhost:9092
  - name: order.id
    value: "citrus:randomNumber(4)"
  - name: order.eventType
    value: "order_placed"
  - name: order.amount
    value: 200
actions:
  - testcontainers:
      compose:
        up:
          file: "_infra/compose.yaml"
  - waitFor:
      timeout: "25000"
      http:
        url: http://localhost:8090
  - camel:
      jbang:
        run:
          integration:
            name: "competing-consumers"
            file: "../competing-consumers.camel.yaml"
            systemProperties:
              file: "../application.properties"

  - camel:
      jbang:
        verify:
          integration: "competing-consumers"
          logMessage: "Routes startup"

  - send:
      endpoint: >-
        kafka:eip.consumer.compete?server=${kafka.broker}
      message:
        body:
          resource:
            file: "templates/order.json"

  - camel:
      jbang:
        verify:
          integration: "competing-consumers"
          logMessage: "Competing consumer"
