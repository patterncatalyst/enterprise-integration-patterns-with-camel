services:
  # ── Kafka (KRaft, single broker) ──────────────────────────────────────────
  kafka:
    image: docker.io/apache/kafka:4.3.1
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=RUlQQ2FtZWxQYXR0ZXJucw
    volumes:
      - kafka-data:/var/lib/kafka/data:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - eip-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=eip-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - eip-net

  # ── Pulsar (standalone) ──────────────────────────────────────────────────
  pulsar:
    image: docker.io/apachepulsar/pulsar:5.0.0
    command: bin/pulsar standalone --advertised-address localhost
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      - PULSAR_MEM=-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m
      - PULSAR_PREFIX_advertisedAddress=localhost
      - PULSAR_STANDALONE_USE_ZOOKEEPER=0
    volumes:
      - pulsar-data:/pulsar/data:Z
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - eip-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: docker.io/library/redis:8.10.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data:Z
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - eip-net

volumes:
  kafka-data:
    name: eip-kafka-data
  pulsar-data:
    name: eip-pulsar-data
  redis-data:
    name: eip-redis-data

networks:
  eip-net:
    name: eip-net
