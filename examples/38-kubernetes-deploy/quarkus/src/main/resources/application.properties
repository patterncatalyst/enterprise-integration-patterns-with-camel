quarkus.application.name=eip-k8s-deploy

kafka.brokers=localhost:9092

quarkus.redis.hosts=redis://localhost:6379

quarkus.http.port=8088

# Image name the generated manifest references. The image itself is built
# with `docker build -f Containerfile` and loaded into minikube with
# `minikube -p eip image load` (see deploy-minikube.sh).
quarkus.container-image.group=eip
quarkus.container-image.name=eip-k8s-deploy
quarkus.container-image.tag=1.0

# Kubernetes manifest generation (target/kubernetes/kubernetes.yml)
quarkus.kubernetes.namespace=default
quarkus.kubernetes.replicas=1
quarkus.kubernetes.image-pull-policy=never
# NodePort 30088 is published on 127.0.0.1 when the minikube profile is
# created, so the API is reachable without port-forward or a tunnel.
quarkus.kubernetes.service-type=node-port
quarkus.kubernetes.node-port=30088
quarkus.kubernetes.env.vars.kafka-brokers=eip-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
quarkus.kubernetes.env.vars.quarkus-redis-hosts=redis://redis.redis.svc.cluster.local:6379
quarkus.kubernetes.resources.requests.cpu=250m
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=512Mi

quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."com.example.eip".level=DEBUG

quarkus.kafka.devservices.enabled=false
