# NodePort 30088 is published on the host at profile creation
# (minikube start --ports=127.0.0.1:30088:30088), so the API answers on
# http://127.0.0.1:30088 with no port-forward or tunnel.
apiVersion: v1
kind: Service
metadata:
  name: eip-k8s-deploy
spec:
  selector:
    app: eip-k8s-deploy
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30088
  type: NodePort
