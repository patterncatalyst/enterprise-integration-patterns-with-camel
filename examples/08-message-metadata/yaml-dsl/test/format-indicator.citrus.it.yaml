name: format-indicator-test
description: Test verifying the Format Indicator pattern — contentType header routes messages to correct processor
variables:
  - name: kafka.broker
    value: localhost:9092
actions:
  - testcontainers:
      compose:
        up:
          file: "_infra/compose.yaml"
  - camel:
      jbang:
        run:
          integration:
            name: "format-indicator"
            file: "../format-indicator.camel.yaml"
            systemProperties:
              file: "../application.properties"

  # --- Scenario 1: Send a JSON order → should be routed through JSON processing ---
  - createVariables:
      variables:
        - name: id
          value: "citrus:randomNumber(4)"
        - name: amount
          value: "99.95"
  - send:
      endpoint: >-
        kafka:eip.metadata.orders.tagged?server=${kafka.broker}
      message:
        headers:
          - name: contentType
            value: "application/json"
          - name: schemaVersion
            value: "1.0"
        body:
          resource:
            file: "templates/order.json"
  - receive:
      endpoint: >-
        kafka:eip.metadata.orders.processed?server=${kafka.broker}&consumerGroup=citrus-orders-processed-group
      message:
        body:
          resource:
            file: "templates/order.json"
  - camel:
      jbang:
        verify:
          integration: "format-indicator"
          logMessage: "JSON format detected"

  # --- Scenario 2: Send an XML order → should be routed through XML processing ---
  - createVariables:
      variables:
        - name: id
          value: "citrus:randomNumber(4)"
  - send:
      endpoint: >-
        kafka:eip.metadata.orders.tagged?server=${kafka.broker}
      message:
        headers:
          - name: contentType
            value: "application/xml"
          - name: schemaVersion
            value: "1.0"
        body:
          data: "<order><order_id>${id}</order_id></order>"
  - receive:
      endpoint: >-
        kafka:eip.metadata.orders.processed?server=${kafka.broker}&consumerGroup=citrus-orders-processed-group
      message:
        body:
          data: "<order><order_id>${id}</order_id></order>"
  - camel:
      jbang:
        verify:
          integration: "format-indicator"
          logMessage: "XML format detected"

  # --- Scenario 3: Send unknown format → should be routed to dead letter ---
  - createVariables:
      variables:
        - name: id
          value: "citrus:randomNumber(4)"
  - send:
      endpoint: >-
        kafka:eip.metadata.orders.tagged?server=${kafka.broker}
      message:
        headers:
          - name: contentType
            value: "text/plain"
          - name: schemaVersion
            value: "1.0"
        body:
          data: "order_id=${id}|item=WIDGET"
  - camel:
      jbang:
        verify:
          integration: "format-indicator"
          logMessage: "Unknown format 'text/plain'"
  - receive:
      endpoint: >-
        kafka:eip.metadata.orders.dead?server=${kafka.broker}&consumerGroup=citrus-dead-group
      message:
        body:
          data: "order_id=${id}|item=WIDGET"
