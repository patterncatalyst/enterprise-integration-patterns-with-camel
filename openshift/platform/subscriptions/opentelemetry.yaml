apiVersion: v1
kind: Namespace
metadata:
  name: openshift-opentelemetry-operator
  labels:
    app.kubernetes.io/part-of: eip
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-opentelemetry-operator
  namespace: openshift-opentelemetry-operator
spec:
  upgradeStrategy: Default
---
# Red Hat build of OpenTelemetry (all namespaces).
# Pinned: installPlanApproval Manual + startingCSV, and install_operator
# (lib.sh) approves only the InstallPlan naming this CSV. Before each use,
# re-check the newest CSV in the channel (references/versions.md):
#   oc get packagemanifest opentelemetry-product -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}{"  "}{.currentCSV}{"\n"}{end}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
  labels:
    app.kubernetes.io/part-of: eip
spec:
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable
  startingCSV: opentelemetry-operator.v0.158.0-2
  installPlanApproval: Manual
