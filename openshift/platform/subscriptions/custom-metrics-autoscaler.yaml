apiVersion: v1
kind: Namespace
metadata:
  name: openshift-keda
  labels:
    app.kubernetes.io/part-of: eip
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-keda
  namespace: openshift-keda
spec:
  targetNamespaces:
    - openshift-keda
---
# Custom Metrics Autoscaler (Red Hat's KEDA) in its own namespace; the KedaController watches every namespace.
# Pinned: installPlanApproval Manual + startingCSV, and install_operator
# (lib.sh) approves only the InstallPlan naming this CSV. Before each use,
# re-check the newest CSV in the channel (references/versions.md):
#   oc get packagemanifest openshift-custom-metrics-autoscaler-operator -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}{"  "}{.currentCSV}{"\n"}{end}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-custom-metrics-autoscaler-operator
  namespace: openshift-keda
  labels:
    app.kubernetes.io/part-of: eip
spec:
  name: openshift-custom-metrics-autoscaler-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable
  startingCSV: custom-metrics-autoscaler.v2.19.0-4
  installPlanApproval: Manual
