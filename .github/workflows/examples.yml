name: Build Examples

on:
  # Run once per change: on the PR, and on main after the merge. A push to a
  # PR branch no longer starts a second, identical run.
  push:
    branches: [main]
  pull_request:


jobs:
  # Decides whether the heavy jobs run. The workflow itself always runs, so the
  # required summary job below always reports — a docs-only PR is not left
  # waiting on a check that never starts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff: run everything
          elif grep -qE '^(examples/|\.github/workflows/examples\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 05-reliability
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 10-composed-routing
          - 11-advanced-routing
          - 12-transformation
          - 13-aggregator
          - 14-consumer-patterns
          - 15-endpoints
          - 16-endpoint-management
          - 17-observability
          - 18-testing-management
          - 19-dsl-comparison
          - 20-kafka-deep-dive
          - 21-pulsar-deep-dive
          - 22-redis-integration
          - 23-quarkus-dev
          - 24-drools-rules
          - 25-quarkus-flow
          - 26-feature-flags
          - 27-observability-stack
          - 32-kafka-consumer-tuning
          - 33-kafka-producer-tuning
          - 37-testing-strategies
          - 38-kubernetes-deploy
          - 42-ai-mcp
          - bond-trading
          - domain-model
          - loan-broker
      fail-fast: false

    name: Build ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Most examples hold one Maven project per runtime, in quarkus/ and
      # spring-boot/ subdirectories. A few (domain-model, 25-quarkus-flow) are a
      # single project rooted at the example directory. Build whichever is present,
      # and fail if an example turns out to contain no project at all — that is how
      # this workflow silently passed nothing before.
      - name: Build ${{ matrix.example }}
        run: |
          set -euo pipefail
          root="examples/${{ matrix.example }}"
          built=0
          for dir in "$root/quarkus" "$root/spring-boot"; do
            if [ -f "$dir/pom.xml" ]; then
              echo "::group::$dir"
              mvn -B -f "$dir/pom.xml" package -DskipTests
              echo "::endgroup::"
              built=$((built + 1))
            fi
          done
          if [ "$built" -eq 0 ]; then
            if [ -f "$root/pom.xml" ]; then
              echo "::group::$root"
              mvn -B -f "$root/pom.xml" package -DskipTests
              echo "::endgroup::"
              built=1
            fi
          fi
          if [ "$built" -eq 0 ]; then
            echo "No pom.xml found under $root" >&2
            exit 1
          fi
          echo "Built $built Maven project(s) for ${{ matrix.example }}"

  # The one check branch protection requires: passes when every job above
  # succeeded or was skipped by `changes`, fails otherwise.
  examples-ok:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
