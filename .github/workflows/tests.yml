name: Integration Tests

on:
  push:
    paths:
      - 'examples/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/tests.yml'

jobs:
  quarkus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 05-reliability
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 10-composed-routing
          - 11-advanced-routing
          - 12-transformation
          - 13-aggregator
          - 14-consumer-patterns
          - 15-endpoints
          - 16-endpoint-management
          - 17-observability
          - 18-testing-management
          - 20-kafka-deep-dive
          - 21-pulsar-deep-dive
          - 22-redis-integration
          - 23-quarkus-dev
          - 24-drools-rules
          - 26-feature-flags
          - 27-observability-stack
          - 37-testing-strategies
      fail-fast: false
    name: Quarkus — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: |
          mvn -B --no-transfer-progress verify -f examples/${{ matrix.example }}/quarkus

  spring-boot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 05-reliability
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 10-composed-routing
          - 11-advanced-routing
          - 12-transformation
          - 13-aggregator
          - 14-consumer-patterns
          - 15-endpoints
          - 16-endpoint-management
          - 17-observability
          - 18-testing-management
          - 20-kafka-deep-dive
          - 21-pulsar-deep-dive
          - 22-redis-integration
          - 24-drools-rules
          - 26-feature-flags
          - 27-observability-stack
          - 37-testing-strategies
      fail-fast: false
    name: Spring Boot — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: |
          mvn -B --no-transfer-progress verify -f examples/${{ matrix.example }}/spring-boot

  quarkus-flow:
    runs-on: ubuntu-latest
    name: Quarkus — 25-quarkus-flow
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: |
          mvn -B --no-transfer-progress verify -f examples/25-quarkus-flow

  yaml-dsl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 11-advanced-routing
          - 14-consumer-patterns
          - 15-endpoints
          - 16-endpoint-management
          - 17-observability
      fail-fast: false
    name: YAML DSL — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache SDKMAN and JBang
        id: cache-sdkman
        uses: actions/cache@v4
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-jbang
      - name: Install JBang
        if: steps.cache-sdkman.outputs.cache-hit != 'true'
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbang
      - name: Setup JBang
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang --version

          # citrus-jbang drives the Camel CLI itself; keep its source trusted.
          jbang trust add https://github.com/apache/camel/

          # Pinned Maven Central artifact, matching the POMs' citrus.version —
          # not the citrus@citrusframework/citrus catalog alias, which floats. The
          # jar has no Main-Class, so --main avoids JBang's chooser prompt.
          jbang --main main.CitrusJBang org.citrusframework:citrus-jbang:5.0.2 --version
          jbang app install --name camel org.apache.camel:camel-launcher:4.22.1
          # jbang app install puts `camel` in ~/.jbang/bin, which a fresh
          # runner (no SDKMAN cache hit) does not have on PATH.
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
          "$HOME/.jbang/bin/camel" version
      - name: Run tests
        env:
          CITRUS_CAMEL_JBANG_DUMP_INTEGRATION_OUTPUT: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR_ENABLED: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR: "mirror.gcr.io"
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang --main main.CitrusJBang org.citrusframework:citrus-jbang:5.0.2 run examples/${{ matrix.example }}/yaml-dsl/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaml-dsl-dumps-${{ matrix.example }}
          include-hidden-files: true
          path: |
            **/.citrus-jbang/*-output.txt

  citrus-cli:
    # Appendix W: the Citrus tests run through the Camel CLI's test plugin
    # (`camel test run`), which the yaml-dsl matrix above does not exercise.
    runs-on: ubuntu-latest
    name: Citrus via camel test — 41-citrus-testing
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache SDKMAN and JBang
        id: cache-sdkman
        uses: actions/cache@v4
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-jbang
      - name: Install JBang
        if: steps.cache-sdkman.outputs.cache-hit != 'true'
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbang
      - name: Install the Camel CLI and its test plugin
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang app install --name camel org.apache.camel:camel-launcher:4.22.1
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
          "$HOME/.jbang/bin/camel" plugin add test
      - name: Run tests
        working-directory: examples/41-citrus-testing
        env:
          CITRUS_CAMEL_JBANG_DUMP_INTEGRATION_OUTPUT: "true"
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          camel test run test/order-validation.citrus.it.yaml
          camel test run test/order-http.citrus.it.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citrus-cli-dumps
          include-hidden-files: true
          path: |
            **/.citrus-jbang/*-output.txt
